name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

# Each job runs on the go.mod minimum and on the latest stable Go.
# fail-fast is off so that a failure on one Go version does not hide the result of the other.
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # A golangci-lint binary built with a Go older than the go.mod directive cannot load the config.
          # Pin an exact v2 release so that the lint result does not change between runs.
          version: v2.15.0

  vet:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...
      # The harness is a separate module, so go test ./... at the root does not build it.
      # Its go.mod declares go 1.26. On the 1.25 job, the go command downloads that toolchain.
      - name: Build tests/interoperability
        working-directory: tests/interoperability
        run: go build ./...

  race:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go test -race ./...
